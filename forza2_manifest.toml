# XAPI fibers, statically linked into the title (XAPILIB 2.0.4802). Replaced by
# the SDK's host-fiber implementation: the guest SwitchToFiber swaps r1 and the
# whole register file by hand (0x82756590), which recompiled code cannot follow.
# Found by scanning for code that reads KTHREAD+0x164 (fiber_ptr).
[entrypoint.rexcrt]
ConvertThreadToFiber = 0x82754CD0
ConvertFiberToThread = 0x82754D60
CreateFiber = 0x82754DB0
DeleteFiber = 0x82754E90
SwitchToFiber = 0x82754EF0

